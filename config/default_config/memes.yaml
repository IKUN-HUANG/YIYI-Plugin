# 这张表定义「# 后面那些参数」：`#摸头#圆`、`#像素化#20`、`#鬼畜#左`……
#
# 每一段用 18 个 # 隔开，一段就是一个表情，方便逐段核对。
#
# 写法：
#   flags  ：开关型参数，「群里敲的词: 接口字段名」，敲了就等于把该字段设成 true
#   fields ：带值的参数，键是详情卡片上显示的中文名，里面写：
#     key    ：接口字段名（不要改）
#     type   ：integer / number / string（带值参数用）
#     values ：枚举型的「别名: 接口值」，敲别名就等于取对应值
#
# 聊天里的写法：
#   文案用 / 或空格分成多段（如 `第一条 第二条/第三条`）；
#   # 只引导参数，第一个 # 之前是文案，之后每段都是参数值；
#   `#鬼畜#左` === `#鬼畜#left`，数字直接写（`#像素化#20`），写参数名则用接口默认值（`#像素化#数值`）。
#
# 默认值来自接口，这张表里写不了 default，只能在注释里标出来。

##################
# 戒导（abstinence）
# 关键词：戒导    文案：0 段
abstinence:
  fields:
    # 指定时间
    时间:
      key: time
      type: string
    # 指定名字
    名字:
      key: name
      type: string

##################
# 安安举牌（acacia_anan_holdsign）
# 关键词：安安举牌 / 夏目安安举牌    文案：1 段    默认文案：快说吾辈可爱
acacia_anan_holdsign:
  fields:
    # 图片编号，0=随机选择，1=第一张(0.png)，2=第二张(1.png)，3=第三张(2.jpg)，
    # 4=第四张(3.jpg)
    数值:
      key: number
      type: integer

##################
# 支付宝支付（alipay）
# 关键词：支付宝支付    文案：0~1 段
alipay:
  fields:
    # 二维码内容
    内容:
      key: message
      type: string

##################
# 一直（always）
# 关键词：一直    文案：0 段
always:
  fields:
    # 生成模式，包含 normal、loop、circle
    # 默认 normal；可选：套娃 / 循环 / 普通 / 正常
    模式:
      key: mode
      values:
        套娃: circle
        循环: loop
        普通: normal
        正常: normal

##################
# 亚托莉枕头（atri_pillow）
# 关键词：亚托莉枕头    文案：1 段    默认文案：ATRI
atri_pillow:
  fields:
    # yes or no
    # 默认 random；可选：是 / 否 / 随机 / -y / -n
    模式:
      key: mode
      values:
        是: yes
        否: no
        随机: random
        '-y': yes
        '-n': no

##################
# ba说（ba_say）
# 关键词：ba说    文案：1 段    默认文案：那我问你
ba_say:
  fields:
    # 角色编号：1、心奈，2、爱丽丝，3、泉奈，4、key，5、玛丽，6、濑名，7、优香
    # 可选：心奈 / 爱丽丝 / 泉奈 / key / 玛丽 / 濑名 / 优香
    角色:
      key: character
      values:
        心奈: 1
        爱丽丝: 2
        泉奈: 3
        key: 4
        玛丽: 5
        濑名: 6
        优香: 7
    # 消息框的位置，包含 left、right、random
    # 默认 random；可选：左 / 右 / 随机
    位置:
      key: position
      values:
        左: left
        右: right
        随机: random

