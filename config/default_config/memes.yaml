# 关键词：微信支付    文案：0~1 段
wechat_pay:
  fields:
    # 二维码内容
    内容:
      key: message
      type: string

##################
# 白猫说（white_cat_say）
# 关键词：白猫说    文案：1 段    默认文案：宝贝~
white_cat_say:
  fields:
    # 图片编号，0=随机选择，1=第一张(1.png)，2=第二张(2.png)
    数值:
      key: number
      type: integer

##################
# 丛雨抱（yuzu_soft_murasame_hug）
# 关键词：丛雨抱    文案：0 段
yuzu_soft_murasame_hug:
  fields:
    # 图片模板编号，1~3  可选：1: 财神丛雨，2: 原版丛雨，3: 虎头丛雨，0 为随机
    # 可选：财神丛雨 / 财神 / 原版丛雨 / 原版 / 虎头丛雨 / 虎头
    数值:
      key: number
      values:
        财神丛雨: 1
        财神: 1
        原版丛雨: 2
        原版: 2
        虎头丛雨: 3
        虎头: 3

##################
# 职业选手（zhiyexuanshou）
# 关键词：职业选手    文案：0 段
zhiyexuanshou:
  fields:
    # 指定名字
    名字:
      key: name
      type: string
