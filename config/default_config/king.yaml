# ========== 王者荣耀（营地） ==========
# 本插件王者荣耀相关功能的总开关：关掉后所有「#王者 / #营地」指令都不响应，
# 定时任务（战绩推送、日周月报）也一并停掉
enable: true

# ========== 接口节流 ==========
# 相邻两次营地请求的最小间隔（毫秒）。营地对每个账号限频，短时间连发会回
# 「-30107 操作频繁」，命中一次这个账号要静默 12 小时，不建议调到 1200 以下
minGapMs: 1200
# 单次营地请求超时（毫秒）。只计发出去之后的等待，不含排队时间
timeoutMs: 10000
# 网络类错误的重试次数（鉴权失效、业务码报错不重试）
retry: 2
# 同时在途的营地请求上限。营地是按账号限频的，不同账号可以并行，
# 这个值只防「几十个群同时发指令」把连接打爆，一般不用动
concurrency: 3
# 外站公开数据（官网英雄表 / 皮肤表 / 资讯）的超时（毫秒）
externalTimeoutMs: 12000

# ========== 营地账号 ==========
# 登录态失效后，多久之内不再拿它去试（小时）
authInvalidHours: 24
# 操作频繁（-30107）后，这个账号静默多久（小时）。
# 试过短冷却，没用：惩罚期远长于半小时，反复试探还会续期，所以一次安静够
rateLimitHours: 12

# ========== 缓存 ==========
# 官网公开表（英雄表 / 皮肤表 / 装备表）落在插件根目录 cache/ 下的有效期（小时）
tableCacheHours: 12
# 对局回顾（地图复盘）的缓存有效期（小时），0 = 不缓存。
# 一场打完的对局不会再变，所以这个值给大一点能省掉每次「详情 + 回顾」两次请求
replayCacheHours: 24
# 缓存目录（插件根目录下的 cache/，公开表 / 对局回顾 / 翻页记录都在这儿）每天自动清一遍的时间。
# 6 段 cron（带秒），默认每天 5:30；手动「#王者清理缓存」随时也能清
cacheSweepCron: '0 30 5 * * *'

# ========== 战绩推送 ==========
# 战绩推送的轮询频率（6 段 cron，带秒）。默认每 2 分钟一圈过一遍所有订阅者。
# 一圈里把「在线状态」和「对局列表」一起读完：上线 / 下线 / 开局 / 结束都落在同一次检查，
# 同一个群只出一张卡；一轮最多出一张战报图（同一场取本群评分最高的那位当主体）
pushCron: '0 */2 * * * *'
# 订阅者久没打游戏时的降频上限。1 = 不降频，5 = 最多慢 5 圈（2 / 4 / 6 / 10 分钟一轮）。
# 倍数按整圈算，永远踩在 2 分钟轴上，不会把同一时刻的动静拆到不同轮次
# 超过 3 小时没动静会直接拉到上限，免得给长期不上线的人白耗请求
pushIdleBackoffMax: 5

# ========== 好友观战 ==========
# 「#观战」走营地 /game/watchBattle 取直播流，请求体里那个 type 字段。
# 营地客户端（camp-tv）固定发 8，含义没逆出来，没有把握不要改
watchType: 8

# 自己搭的观战播放页地址（页面源码见 TEST/Docs/King/watch-page/index.php，插件不附带）。
# 填了之后群里发的观战链接就是这个页面给出的链接；视频仍是观众浏览器直连营地 CDN，
# 这台机器不转发。地址留空 / 打不通，就退回原来的短链服务，再不行发营地原链。
# 必须写 http://，不能写 https://：营地只给 http 的 HTTP-FLV，https 页面拉 http 流
# 会被浏览器按「混合内容」拦掉。同理这个站点的 80 端口不要跳 https、也不要发 HSTS。
# 例：http://example.com/index.php（放子目录就写 http://example.com/King/index.php）
watchPageUrl: 'http://king.h.kesally.ren/index.php'
# 和播放页里的 WATCH_SECRET 填成同一串，至少 16 位。两个都填了才会用播放页
watchPageSecret: 'HHAY-NGM-WZDSNY-XHZSBSYB'

# ========== 日常与提醒 ==========
# 出问题私信谁：主人 QQ，多个用逗号 / 空格 / 顿号分开。
# 登录信息失效、「操作频繁」这些东西群里刷屏没意义，只私信这里写的人；
# 留空就从 Bot 配置里的 masterQQ 兜底。容器里没 Bot 时只在日志里留一行
masterQQ: ''
# 登录态保活：每天拿存的号跑一次轻查询，失效就私信主人（6 段 cron，带秒），默认每天 7:30。
# 只签用户自己扫码存下的号，不拿公共池的号替别人做写操作
keepAliveCron: '0 30 7 * * *'
# 公告 / 皮肤上新巡检时间（6 段 cron，带秒），默认每天 20:15。
# 第一次跑只记基线不推送，之后有新公告或新皮肤才私信订阅的人，一天最多一条
alertCron: '0 15 20 * * *'

# ========== 群战报自动推送 ==========
# 只有群主、管理员或主人发过「#开启王者群日报推送」的群才会收到，跟着 cron 自动出图。
# 三条 cron 都是 6 段（带秒），时间是本机时区；月报那份只在 28 号之后才推，
# 而且必须当天是本月最后一天，所以 28-31 号每天都试一次也没关系
groupDailyReportCron: '0 22 23 * * *'
groupWeeklyReportCron: '0 34 21 * * 0'
groupMonthlyReportCron: '0 18 23 28-31 * *'
