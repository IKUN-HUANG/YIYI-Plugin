<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{_res_path}}King/king.css">
</head>
<body class="k-body-narrow">
<div class="k-card is-narrow">
  <div class="k-bg">
    <span class="k-glow k-glow--1"></span>
    <span class="k-glow k-glow--2"></span>
    <span class="k-glow k-glow--3"></span>
  </div>

  <div class="k-content">
    <div class="k-head">
      <div class="k-head-main">
        <div class="k-title">
          {{if logoSrc}}<img class="k-logo" src="{{logoSrc}}">{{/if}}
          <span>{{title}}</span>
        </div>
        <div class="k-sub">
          {{if sub}}<span class="k-badge">{{sub}}</span>{{/if}}
          {{if genTime}}<span class="k-time">{{genTime}}</span>{{/if}}
        </div>
      </div>
      <div class="page-badges">
        <span class="page-version">{{pluginTitle || pluginName}} v{{version}}</span>
        <span class="env-tag env-tag--{{yunzai.flavor}}">{{yunzai.display}}</span>
      </div>
    </div>

    <div class="k-para">{{body}}</div>

    {{if note}}<div class="k-note">{{note}}</div>{{/if}}
  </div>
</div>
</body>
</html>
